<div class="container">
  <header class="header">
    <div class="logo">
      <img src="assets/logo.png" alt="CineGo" class="logo" />
    </div>
    <div class="user-section">
      <div class="user-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <span class="user-text">Usuario</span>
    </div>
  </header>

  <h1 class="titulo-cartelera">Películas</h1>

  <div class="peliculas-grid">
    <div 
      class="pelicula-card" 
      *ngFor="let pelicula of peliculas; let i = index"
      (click)="seleccionarPelicula(i)"
      [class.selected]="selectedRow === i">
      
      <div class="poster-container">
        <img [src]="pelicula.poster" [alt]="pelicula.titulo" class="poster">
      </div>

      <div class="pelicula-info">
        <h3 class="pelicula-titulo">{{ pelicula.titulo }}</h3>
        <p class="pelicula-detalles">
          {{ pelicula.estado }} - {{ pelicula.clasificacion }} - {{ pelicula.genero }}
        </p>
      </div>
    </div>
  </div>

  <div class="button-group">
    <button (click)="onNew()">NUEVO</button>
    <button (click)="onEdit()">EDITAR</button>
    <button (click)="onDelete()">ELIMINAR</button>
    <button (click)="onView()">VER</button>
  </div>
</div>
