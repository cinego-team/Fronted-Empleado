<div class="page">
  <header class="topbar">
    <img src="/assets/logo.png" alt="CineGo" class="logo" />
    <div class="user-section">
      <img src="assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h1>Editar Promoción</h1>

      @if (form) {
      <form class="form" [formGroup]="form" (ngSubmit)="onSave()">
        <!-- ID SOLO LECTURA -->
        <div class="form-group">
          <label>ID</label>
          <div class="readonly-text">{{ promocion?.id }}</div>
        </div>

        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input id="nombre" formControlName="nombre" />
        </div>

        <!-- Día -->
        <div class="form-group">
          <label for="dia">Día</label>
          <select id="dia" formControlName="dia">
            <option [ngValue]="''" disabled>Seleccione un día</option>

            @for (dia of dias; track dia.id) {
            <option [value]="dia.id">{{ dia.id }}- {{ dia.nombre }}</option>
            }
          </select>
        </div>

        <!-- Porcentaje -->
        <div class="form-group">
          <label for="porcentajeDescuento">Porcentaje Descuento</label>
          <input id="porcentajeDescuento" type="number" formControlName="porcentajeDescuento" />
        </div>

        <!-- Tipo Cliente -->
        <div class="form-group">
          <label for="tipoCliente">Tipo Cliente</label>
          <select id="tipoCliente" formControlName="tipoCliente">
            <option [ngValue]="''" disabled>Seleccione tipo de cliente</option>

            @for (tipo of tiposCliente; track tipo.id) {
            <option [value]="tipo.id">{{ tipo.id }}-{{ tipo.denominacion }}</option>
            }
          </select>
        </div>

        <button type="submit">GUARDAR</button>
      </form>
      }
    </section>

    <div class="button-group">
      <button (click)="volver()">VOLVER</button>
    </div>
  </main>
</div>
