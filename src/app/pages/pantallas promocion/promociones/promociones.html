<!-- Topbar -->
<header class="topbar">
  <img src="/assets/logo.png" alt="CineGo" class="logo" (click)="inicio()" />
  <div class="user-section">
    <img src="/assets/usuario.png" alt="Usuario" class="user-icon" />
    <span>Usuario</span>
  </div>
</header>
<div class="page">
  <h1>Promociones</h1>
  <div class="tabla-container">
    <table class="tabla-formatos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Porcentaje de Descuento</th>
          <th>Tipo Cliente</th>
          <th>dia</th>
        </tr>
      </thead>
      <tbody>
        @for (tipo of promociones; track tipo.id) {
        <tr
          [class.selected]="selectedRow === promociones.indexOf(tipo)"
          (click)="selectRow(promociones.indexOf(tipo))"
        >
          <td>{{ tipo.id }}</td>
          <td>{{ tipo.nombre }}</td>
          <td>{{ tipo.porcentajeDescuento }}</td>
          <td>{{ tipo.tipoCliente }}</td>
          <td>{{ tipo.dia }}</td>
        </tr>
        }
      </tbody>
    </table>
    <div class="button-group">
      <button (click)="onBack()">VOLVER</button>
      <button (click)="onNew()">NUEVA</button>
      <button (click)="onDelete()">ELIMINAR</button>
      <button (click)="onEdit()">EDITAR</button>
    </div>
  </div>
</div>
