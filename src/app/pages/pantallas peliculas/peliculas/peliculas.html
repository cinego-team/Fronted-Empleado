   <header class="topbar">
    <img src="/assets/logo.png" alt="CineGo" class="logo" />
    <div class="user-section">
      <img src="assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </div>
  </header>
  <div class=conteiner></div>
  <h1 class="titulo-cartelera">Películas</h1>

  <div class="peliculas-grid">
    <div 
      class="pelicula-card" 
      *ngFor="let pelicula of peliculas; let i = index"
      (click)="seleccionarPelicula(i)"
      [class.selected]="selectedRow === i">
      
      <div class="poster-container">
        <img [src]="pelicula.poster" [alt]="pelicula.titulo" class="poster">
      </div>

      <div class="pelicula-info">
        <h3 class="pelicula-titulo">{{ pelicula.titulo }}</h3>
        <p class="pelicula-detalles">
          {{ pelicula.estado }} - {{ pelicula.clasificacion }} - {{ pelicula.genero }}
        </p>
      </div>
    </div>
  </div>

  <div class="button-group">
    <button class="btn" (click)="onBack()">VOLVER</button>
    <button class="btn" (click)="onNew()">NUEVO</button>
    <button class="btn" (click)="onEdit()">EDITAR</button>
    <button class="btn" (click)="onDelete()">ELIMINAR</button>
    <button class="btn" (click)="onView()">VER</button>
  </div>
