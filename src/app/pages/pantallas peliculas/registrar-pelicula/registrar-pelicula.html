<div class="container">
  <app-header></app-header>

  <!-- Título -->
  <div class="register-box">
    <h2>Registrar película</h2>

    <!-- Formulario -->
    <form [formGroup]="form">
      <div class="form-group">
        <label>Título</label>
        <input formControlName="titulo" type="text" />

        <label>Estado</label>
        <select formControlName="estado">
          <option value="">Seleccione</option>
          <option *ngFor="let e of estados" [value]="e">{{ e.id }}- {{ e.nombre }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Duración</label>
        <input formControlName="duracion" type="number" placeholder="min" />

        <label>Clasificación</label>
        <select formControlName="clasificacion">
          <option value="">Seleccione</option>
          <option *ngFor="let c of clasificaciones" [value]="c">{{ c.id }}-{{ c.nombre }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fecha Estreno</label>
        <input formControlName="fechaEstreno" type="date" />

        <label>Género</label>
        <select formControlName="genero">
          <option value="">Seleccione</option>
          <option *ngFor="let g of generos" [value]="g">{{ g.id }}-{{ g.nombre }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Director</label>
        <input formControlName="director" type="text" />
      </div>

      <label>Sinopsis</label>
      <textarea formControlName="sinopsis"></textarea>

      <label>URL Imagen</label>
      <input formControlName="urlImagen" type="text" />

      <button class="btn" (click)="onSave()">REGISTRAR</button>
    </form>
  </div>

  <div class="button-group">
    <button class="btn" (click)="OnBack()">VOLVER</button>
  </div>
</div>
