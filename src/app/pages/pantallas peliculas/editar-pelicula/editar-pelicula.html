<div class="container">
  <app-header></app-header>

  <main class="wrap">
    <section class="card">
      <h1>Editar Pelicula</h1>

      @if (pelicula) {
      <form [formGroup]="form" (ngSubmit)="onSave()" class="form">

        <!-- ID -->
        <div class="form-group">
          <label for="id">ID</label>
          <div class="pill">{{ pelicula.id }}</div>
        </div>

        <!-- Titulo + Estado -->
        <div class="form-row">
          <div class="form-group">
            <label for="titulo">Titulo</label>
            <input id="titulo" type="text" formControlName="titulo" />
          </div>
          <div class="form-group">
            <label for="estado">Estado</label>
            <select id="estado" formControlName="estado" [compareWith]="compareById">
              <option value="" disabled>Seleccione</option>
              <option *ngFor="let e of estados" [ngValue]="e">{{ e.nombre }}</option>
            </select>
          </div>
        </div>

        <!-- Duracion + Clasificacion -->
        <div class="form-row">
          <div class="form-group">
            <label for="duracion">Duracion</label>
            <input id="duracion" type="number" formControlName="duracion" placeholder="min" />
          </div>
          <div class="form-group">
            <label for="clasificacion">Clasificacion</label>
            <select id="clasificacion" formControlName="clasificacion" [compareWith]="compareById">
              <option value="" disabled>Seleccione</option>
              <option *ngFor="let c of clasificaciones" [ngValue]="c">{{ c.nombre }}</option>
            </select>
          </div>
        </div>

        <!-- Fecha Estreno + Genero -->
        <div class="form-row">
          <div class="form-group">
            <label for="fechaEstreno">Fecha Estreno</label>
            <input id="fechaEstreno" type="date" formControlName="fechaEstreno" />
          </div>
          <div class="form-group">
            <label>Genero</label>
            <select id="genero" formControlName="genero" [compareWith]="compareById">
              <option value="" disabled>Seleccione</option>
              <option *ngFor="let g of generos" [ngValue]="g">{{ g.nombre }}</option>
            </select>
          </div>
        </div>

        <!-- Director (ancho completo) -->
        <div class="form-row full">
          <div class="form-group full">
            <label for="director">Director</label>
            <input id="director" type="text" formControlName="director" />
          </div>
        </div>

        <!-- Sinopsis (ancho completo) -->
        <div class="form-row full">
          <div class="form-group full">
            <label for="sinopsis">Sinopsis</label>
            <input id="sinopsis" type="text" formControlName="sinopsis" />
          </div>
        </div>

        <!-- URL Imagen (ancho completo) -->
        <div class="form-row full">
          <div class="form-group full">
            <label for="urlImagen">URL Imagen</label>
            <input id="urlImagen" type="text" formControlName="urlImagen" />
          </div>
        </div>

        <button type="submit" [disabled]="form.invalid">GUARDAR</button>
      </form>
      }
    </section>
  </main>

  <div class="button-group">
    <button (click)="onBack()">VOLVER</button>
  </div>
</div>
