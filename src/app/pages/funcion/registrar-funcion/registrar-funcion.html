<div class="container">
  <!-- Header con logo y usuario -->
<header class="topbar">
    <img src="/assets/logo.png" alt="CineGo" class="logo" />
    <div class="user-section">
      <img src="/assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </div>
  </header>

  <!-- Formulario principal -->
  <main class="form-card">
    <h2>Registrar Función</h2>

    <form>
      <div class="form-row">
        <div class="form-group">
          <label for="pelicula">Película</label>
          <select id="pelicula">
            <option>Seleccione la pelicula</option>
          </select>
        </div>
        <div class="form-group">
          <label for="formato">Formato</label>
          <select id="formato">
            <option>Seleccione el formato</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group fecha">
          <label for="fecha">Fecha</label>
          <div class="fecha-inputs">
            <select><option>Día</option></select>
            <select><option>Mes</option></select>
            <select><option>Año</option></select>
          </div>
        </div>
        <div class="form-group">
          <label for="sala">Sala</label>
          <select id="sala">
            <option>Seleccione la sala</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="hora">Hora</label>
          <input type="time" id="hora" />
        </div>
        <div class="form-group">
          <label for="disponible">Disponible</label>
          <select id="disponible">
            <option>Fuera de cartelera</option>
            <option>En cartelera</option>
            <option>Proximo estreno</option>

          </select>
        </div>
      </div>

      <div class="form-actions">
      <button type="submit" class="btn-registrar" (click)="registrar()">Registrar</button>
      </div>
    </form>
   
  </main>
 <div class="botones">
    <button class="btn" (click)="volver()">VOLVER</button>
    </div>
</div>
