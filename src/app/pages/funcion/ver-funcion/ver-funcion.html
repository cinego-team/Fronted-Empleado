<!-- Header con logo y usuario -->
<header class="topbar">
  <img src="/assets/logo.png" alt="CineGo" class="logo" (click)="inicio()" />
  <div class="user-section">
    <img src="/assets/usuario.png" alt="Usuario" class="user-icon" />
    <span>Usuario</span>
  </div>
</header>

<div class="container">
  <!-- Tarjeta principal -->
  <main class="form-card">
    <h2>Función</h2>

    <!-- ID -->
    <div class="form-groupId">
      <label>ID</label>
      <p class="value">{{ funcion?.id }}</p>
    </div>

    <!-- Película y Formato -->
    <div class="form-row">
      <div class="form-group">
        <label>Película</label>
        <p class="value">{{ funcion?.pelicula }}</p>
      </div>

      <div class="form-group">
        <label>Formato y Precio</label>
        <p class="value">{{ funcion?.formato?.nombre }} - ${{ funcion?.formato?.precio }}</p>
      </div>
    </div>

    <!-- Fecha y Sala -->
    <div class="form-row">
      <div class="form-group fecha">
        <label>Fecha</label>
        <p class="value">{{ funcion?.fecha }}</p>
      </div>

      <div class="form-group">
        <label>Sala</label>
        <p class="value">Sala {{ funcion?.NumeroSala }}</p>
      </div>
    </div>

    <!-- Hora y Disponible -->
    <div class="form-row">
      <div class="form-group">
        <label>Hora</label>
        <p class="value">{{ funcion?.hora }}</p>
      </div>

      <div class="form-group">
        <label>Disponible</label>
        <p class="value">
          {{ funcion?.disponible ? 'Disponible' : 'No Disponible' }}
        </p>
      </div>
    </div>

    <!-- Botón volver -->
    <div class="form-actions">
      <button class="btn" (click)="volver()">VOLVER</button>
    </div>
  </main>
</div>
