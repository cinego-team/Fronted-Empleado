<div class="container">
  <!-- Header con logo y usuario -->
  <header class="header">
    <div class="logo-container">
      <img src="assets/logo.png" alt="CineGo Logo" class="logo" />
    </div>
    <div class="user">
      <i class="icon-user"></i>
      <span>Usuario</span>
    </div>
  </header>

  <!-- Formulario principal -->
  <main class="form-card">
    <h2>Registrar Función</h2>

    <form>
        <div class="form-groupId">
            <label for="id"></label>
            <input id="id" type="text"  placeholder="ID:" disabled />
        </div>
      <div class="form-row">
        <div class="form-group">
          <label for="pelicula">Película</label>
          <input id="id" type="text" disabled />
        </div>
        <div class="form-group">
          <label for="formato">Formato</label>
          <input id="id" type="text" disabled />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group fecha">
          <label for="fecha">Fecha</label>
          <div class="fecha-inputs">
            <input id="id" type="text" disabled />
            <input id="id" type="text" disabled />
            <input id="id" type="text" disabled />
          </div>
        </div>
        <div class="form-group">
          <label for="sala">Sala</label>
          <input id="id" type="text" disabled />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="hora">Hora</label>
          <input type="time" id="hora" disabled/>
        </div>
        <div class="form-group">
          <label for="disponible">Disponible</label>
          <input id="id" type="text" disabled />
        </div>
      </div>
    </form>
    <div class="flecha"  (click)="volver()">
        &#10132;
    </div>
  </main>
</div>
