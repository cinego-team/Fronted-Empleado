<div class="container">
  <!-- Header -->
  <header class="header">
    <img src="assets/logo.png" alt="CineGo" class="logo" />
    <div class="usuario">
      <span class="icono-usuario">&#128100;</span>
      <span>Usuario</span>
    </div>
  </header>

  <!-- Título -->
  <h1 class="titulo">FUNCIONES</h1>

  <!-- Tabla -->
  <div class="tabla-container">
    <table class="tabla-funciones">
      <thead>
        <tr>
          <th>ID</th>
          <th>Pelicula</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Disponible</th>
          <th>Sala</th>
          <th>Formato</th>
        </tr>
      </thead>
        <tbody>
        <tr *ngFor="let funcion of funciones; let i = index"
            [class.selected]="selectedIndex === i"
            (click)="selectRow(i)">
            <td>{{ funcion.id }}</td>
            <td>{{ funcion.pelicula }}</td>
            <td>{{ funcion.fecha }}</td>
            <td>{{ funcion.hora }}</td>
            <td>{{ funcion.disponible }}</td>
            <td>{{ funcion.sala }}</td>
            <td>{{ funcion.formato }}</td>
            
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botones -->
  <div class="botones">
    <button class="btn" (click)="nuevaFuncion()">NUEVA SALA</button>
    <button class="btn" (click)="ver()">VER</button>
    <button class="btn">ELIMINAR</button>
    <button class="btn" (click)="editarFuncion()">EDITAR</button>
  </div>

  <!-- Flecha de navegación -->
  <div class="flecha">
    &#10132;
  </div>
</div>
