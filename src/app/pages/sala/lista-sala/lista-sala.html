<app-header></app-header>
<div class="container">
  <!-- Título -->
  <h1 class="titulo">SALAS</h1>

  <!-- Tabla -->
  <div class="tabla-container">
    <table class="tabla-salas">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nro</th>
          <th>Disponibilidad</th>
          <th>Cantidad Filas</th>
          <th>Capacidad</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let sala of salas; let i = index"
          [class.selected]="selectedIndex === i"
          (click)="selectRow(i)"
        >
          <td>{{ sala.id }}</td>
          <td>{{ sala.numero }}</td>
          <td>{{ sala.disponibilidad }}</td>
          <td>{{ sala.cantFilas }}</td>
          <td>{{ sala.capacidad }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botones -->
  <div class="button-group">
    <button class="btn" (click)="nuevaSala()">NUEVA SALA</button>
    <button class="btn" (click)="eliminar()">ELIMINAR</button>
    <button class="btn" (click)="editar()">EDITAR</button>
    <button class="btn" (click)="volver()">VOLVER</button>
  </div>
</div>
