<app-header></app-header>
<div class="page">
  <!-- Contenedor principal -->
  <main class="wrap">
    <section class="card">
      <h1>Editar Sala</h1>

      @if (sala) {
        <form (ngSubmit)="onSave()">
          <div class="form-group">
            <label>ID</label>
            <div class="pill">{{ sala.id }}</div>
          </div>

          <div class="form-group">
            <label for="numero">Numero de sala </label>
            <input id="numero" [(ngModel)]="sala.numero" name="numero" required />
          </div>
          <div class="form-group">
            <label for="disponibilidad">Disponibilidad</label>
            <select
              id="disponibilidad"
              name="disponibilidad"
              [(ngModel)]="sala.disponibilidad"
              required
            >
              <option [ngValue]="true">Disponible</option>
              <option [ngValue]="false">No disponible</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fila">Cantidad de filas</label>
            <input id="fila" [(ngModel)]="sala.fila" name="fila" required />
          </div>
          <div class="form-group">
            <label for="butaca">Cantidad de butacas por fila</label>
            <input id="butaca" [(ngModel)]="sala.butaca" name="butaca" required />
          </div>

          <button type="submit">GUARDAR</button>
        </form>
      }
    </section>
    <div class="button-group">
      <button (click)="volver()">VOLVER</button>
    </div>
  </main>
</div>
