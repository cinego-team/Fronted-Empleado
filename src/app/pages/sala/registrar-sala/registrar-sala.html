<div class="container">
  <app-header></app-header>

  <!-- Contenedor principal -->
  <main class="form-container">
    <h2>Registrar Sala</h2>

    <form [formGroup]="form" (ngSubmit)="registrar()">
      <div class="form-group">
        <label for="numero">Numero de sala </label>
        <input type="number" id="numero" formControlName="numero" />
        <div *ngIf="form.get('numero')?.touched && form.get('numero')?.invalid" class="error">
          <small class="text-danger" *ngIf="form.get('numero')?.errors?.['required']"
            >El numero de sala es obligatorio.</small
          >
        </div>
      </div>
      <div class="form-group">
        <select formControlName="disponibilidad" class="input-redondo">
          <option *ngFor="let op of disponibilidadOpciones" [ngValue]="op.value">
            {{ op.label }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label for="fila">Cantidad de filas </label>
        <input type="number" id="fila" formControlName="fila" />
        <div *ngIf="form.get('fila')?.touched && form.get('fila')?.invalid" class="error">
          <small class="text-danger" *ngIf="form.get('fila')?.errors?.['required']"
            >La cantidad de filas es obligatorio.</small
          >
        </div>
      </div>
      <div class="form-group">
        <label for="butaca">Cantidad de butacas por fila </label>
        <input type="number" id="butaca" formControlName="butaca" />
        <div *ngIf="form.get('butaca')?.touched && form.get('butaca')?.invalid" class="error">
          <small class="text-danger" *ngIf="form.get('butaca')?.errors?.['required']"
            >La cantidad de butacas es obligatorio.</small
          >
        </div>
      </div>

      <button type="submit" class="btn-registrar" (click)="registrar()">Registrar</button>
    </form>
  </main>
  <div class="button-group">
    <button (click)="volver()">VOLVER</button>
  </div>
</div>
