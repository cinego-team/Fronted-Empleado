<app-header></app-header>
<div class="page">
  <h1>Clasificaciones</h1>
  <div class="tabla-container">
    <table class="tabla-formatos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
        </tr>
      </thead>
      <tbody>
        @for (tipo of clasificaciones; track tipo.id; let i = $index) {
        <tr [class.selected]="selec === i" (click)="seleccionar(i)">
          <td>{{ tipo.id }}</td>
          <td>{{ tipo.nombre }}</td>
        </tr>
        }
      </tbody>
    </table>
    <div class="button-group">
      <button (click)="volver()">VOLVER</button>
      <button (click)="nuevo()">NUEVO</button>
      <button (click)="eliminar()">ELIMINAR</button>
      <button (click)="editar()">EDITAR</button>
    </div>
  </div>
</div>
