<div class="page">
  <header class="topbar">
    <img src="/assets/logo.png" alt="CineGo" class="logo" />
    <div class="user-section">
      <img src="/assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </div>
  </header>

  <main class="wrap">
    <h1>Clasificacion</h1>

    
      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let g of generos"
            (click)="seleccionar(g)"
            [class.sel]="seleccion?.id === g.id"
            tabindex="0"
          >
            <td>{{ g.id }}</td>
            <td>{{ g.nombre }}</td>
          </tr>
        </tbody>
      </table>
    

    <div class="actions">
       <button (click)="volver()">VOLVER</button>
        <button (click)="nuevo()">NUEVA</button>

        <button (click)="!seleccion" (click)="eliminar()">ELIMINAR</button>

        <button (click)="!seleccion" (click)="editar()">EDITAR</button>
      </div>
  </main>
</div>
