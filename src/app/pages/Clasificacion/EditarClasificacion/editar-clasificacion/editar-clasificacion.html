<div class="page">
  <app-header></app-header>

  <main class="wrap">
    <section class="card">
      <h1>Editar clasificación</h1>

      @if (clasificacion) {
        <!-- <CHANGE> Agregar clase 'form' al formulario -->
        <form class="form" (ngSubmit)="onSave()">
          <div class="form-group">
            <label for="id">ID</label>
            <!-- <CHANGE> Usar clase 'pill' para el ID -->
            <div class="pill">{{ clasificacion.id }}</div>
          </div>

          <div class="form-group">
            <label for="name">Nombre</label>
            <input id="name" [(ngModel)]="clasificacion.nombre" name="name" required />
          </div>

          <button type="submit">GUARDAR</button>
        </form>
      }
    </section>

    <div class="button-group">
      <button (click)="volver()">VOLVER</button>
    </div>
  </main>
</div>
