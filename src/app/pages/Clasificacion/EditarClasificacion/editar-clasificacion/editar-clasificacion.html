<div class="page">
  <header class="topbar">
    <img src="/assets/logo.png" alt="CineGo" class="logo" />
    <div class="user-section">
      <img src="assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h1>Editar Clasificación</h1>

      @if (clasificacion) {
      <form (ngSubmit)="onSave()">
        <div class="form-group">
          <label for="id">ID</label>
          <div class="readonly-text">{{ clasificacion.id }}</div>
        </div>

        <div class="form-group">
          <label for="name">Nombre</label>
          <input id="name" [(ngModel)]="clasificacion.name" name="name" required />
        </div>

        <button type="submit">GUARDAR</button>
      </form>
      }
    </section>

    <div class="button-group">
      <button (click)="volver()">VOLVER</button>
    </div>
  </main>
</div>
