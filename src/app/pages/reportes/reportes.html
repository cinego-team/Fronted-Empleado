<div class="contenedor">
  <header class="topbar">
    <img src="assets/logo.png" alt="CineGo" class="logo" />
    <div class="user-section">
      <img src="assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </div>
  </header>

  <h1 class="titulo">Reportes</h1>

  <!-- CARD 1 -->
  <div class="card">
    <h2 class="card-title">Los 5 horarios más elegidos en el mes</h2>
    <div class="grafico-container">
      <canvas id="graficoHorarios"></canvas>
    </div>
  </div>

  <!-- CARD 2 -->
  <div class="card">
    <h2 class="card-title">Películas por rango de ventas (cada 1000 ventas)</h2>
    <div class="grafico-container">
      <canvas id="graficoRangos"></canvas>
    </div>
  </div>

  <!-- CARD 3 -->
  <div class="card">
    <h2 class="card-title">Entradas vendidas por día de la semana en el mes</h2>
    <div class="grafico-container">
      <canvas id="graficoDias"></canvas>
    </div>
  </div>
</div>
