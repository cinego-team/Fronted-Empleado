<div class="container">
  <!-- Logo -->
  <header class="topbar">
    <img src="/assets/logo.png" alt="CineGo" class="logo" />
    <div class="user-section">
      <img src="/assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </div>
  </header>

  <!-- Botones principales -->
  <div class="register-box">
    <h2>¿Qué deseas hacer hoy?</h2>
    <div class="buttons-wrapper">
      <div class="buttons">
        <button (click)="onRegister()">REGISTRAR NUEVO EMPLEADO</button>
        <button (click)="onAdministrar()">ADMINISTRAR</button>
        <button (click)="onReportes()">VER REPORTES</button>
        <button (click)="onVentas()">VER VENTAS</button>
      </div>
    </div>
  </div>
</div>
