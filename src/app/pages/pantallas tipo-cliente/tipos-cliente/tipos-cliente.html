<app-header></app-header>

<div class="page">
  <h1>Tipo Cliente</h1>

  <div class="tabla-container">
    <table class="tabla-formatos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Denominación</th>
          <th>Descripción</th>
        </tr>
      </thead>

      <tbody>
        @for (tipo of tiposCliente; track tipo.id; let i = $index) {
          <tr [class.selected]="selectedIndex === i" (click)="selectRow(i)">
            <td>{{ tipo.id }}</td>
            <td>{{ tipo.denominacion }}</td>
            <td>{{ tipo.descripcion }}</td>
          </tr>
        }
      </tbody>
    </table>

    <div class="button-group">
      <button (click)="onNew()">NUEVO</button>
      <button (click)="onEdit()">EDITAR</button>
      <button (click)="onDelete()">ELIMINAR</button>
      <button (click)="onBack()">VOLVER</button>
    </div>
  </div>
</div>
