<div class="page">
  <app-header></app-header>

  <main class="wrap">
    <section class="card">
      <h1>Editar Tipo Cliente</h1>

      @if (tipoCliente) {
      <form (ngSubmit)="onSave()">
        <div class="form-group">
          <label for="id">ID</label>
          <div class="readonly-text">{{ tipoCliente.id }}</div>
        </div>

        <div class="form-group">
          <label for="denominacion">Denominación</label>
          <input
            id="denominacion"
            [(ngModel)]="tipoCliente.denominacion"
            name="denominacion"
            required
          />
        </div>
        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <input
            id="descripcion"
            [(ngModel)]="tipoCliente.descripcion"
            name="descripcion"
            required
          />
        </div>

        <button type="submit">GUARDAR</button>
      </form>
      }
    </section>

    <div class="button-group">
      <button (click)="volver()">VOLVER</button>
    </div>
  </main>
</div>
