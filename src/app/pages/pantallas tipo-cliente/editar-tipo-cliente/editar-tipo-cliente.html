<div class="page">
  <app-header></app-header>

  <main class="wrap">
    <section class="card">
      <h1>Editar Tipo Cliente</h1>

      @if (tipoCliente) {
        <!-- <CHANGE> Agregar clase 'form' al formulario -->
        <form class="form" (ngSubmit)="onSave()">
          <div class="form-group">
            <label for="id">ID</label>
            <!-- <CHANGE> Usar clase 'pill' para el ID -->
            <div class="pill">{{ tipoCliente.id }}</div>
          </div>

          <div class="form-group">
            <label for="name">Denominación</label>
            <input id="name" [(ngModel)]="tipoCliente.denominacion" name="name" required />
          </div>
          <div class="form-group">
            <label for="descripcion">Descripción</label>
            <input
              id="descripcion"
              [(ngModel)]="tipoCliente.descripcion"
              name="descripcion"
              required
            />
          </div>

          <button type="submit">GUARDAR</button>
        </form>
      }
    </section>

    <div class="button-group">
      <button (click)="volver()">VOLVER</button>
    </div>
  </main>
</div>
