<div class="page">
  <app-header></app-header>

  <main class="wrap">
    <section class="card">
      <h1>Registrar Tipo Cliente</h1>

      <form [formGroup]="form" (ngSubmit)="onSave()">
        @if (error) {
        <div class="alert alert-danger">{{ error }}</div>
        }
        <div class="form-group">
          <label for="nombre">Denominacion</label>
          <input id="nombre" formControlName="nombre" />
          @if (form.get('name')?.invalid && form.get('name')?.touched) {
          <small class="text-danger">Denominacion requerida (mínimo 2 letras)</small>
          }
        </div>
        <div class="form-group">
          <label for="nombre">Descripción</label>
          <input id="nombre" formControlName="nombre" required />
          <span
            *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched"
            class="text-danger"
          >
            Descripción obligatoria
          </span>
        </div>

        <button type="submit" (click)="(form.invalid)">REGISTRAR</button>
      </form>
    </section>
  </main>
  <div class="button-group">
    <button (click)="volver()">VOLVER</button>
  </div>
</div>
