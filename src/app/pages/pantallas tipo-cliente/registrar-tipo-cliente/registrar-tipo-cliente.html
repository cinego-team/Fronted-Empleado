<div class="page">
  <!-- Topbar -->
  <header class="topbar">
    <img src="/assets/logo.png" alt="CineGo" class="logo" />
    <div class="user-section">
      <img src="/assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </div>
  </header>

  <!-- Main content -->
  <main class="wrap">
    <section class="card">
      <h1>Registrar Tipo Cliente</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
        <label for="nombre">Nombre</label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          placeholder=""
        />

        <button type="submit">REGISTRAR</button>
      </form>
    </section>
  </main>
</div>
