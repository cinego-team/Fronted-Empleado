<app-header></app-header>
<div class="page">
  <main class="wrap">
    <section class="register-box">
      <h1>Registrar Tipo Cliente</h1>

      <form [formGroup]="form" (ngSubmit)="onSave()">
        <div class="form-group">
          <label for="denominacion">Denominación</label>
          <input id="denominacion" formControlName="denominacion" />

          @if (form.get('denominacion')?.invalid && form.get('denominacion')?.touched) {
            <small class="text-danger"> Denominación requerida (mínimo 2 letras) </small>
          }
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <input id="descripcion" formControlName="descripcion" />

          @if (form.get('descripcion')?.invalid && form.get('descripcion')?.touched) {
            <small class="text-danger"> Descripción obligatoria </small>
          }
        </div>

        <button type="submit" [disabled]="form.invalid">REGISTRAR</button>
      </form>
    </section>
  </main>
  <div class="button-group">
    <button (click)="volver()">VOLVER</button>
  </div>
</div>
