<div class="container">
  <!-- Header con logo y usuario -->
  <header class="header">
    <div class="logo-container">
      <img src="assets/logo.png" alt="CineGo Logo" class="logo" />
    </div>
    <div class="user">
      <i class="icon-user"></i>
      <span>Usuario</span>
    </div>
  </header>

  <!-- Contenedor principal -->
  <main class="form-container">
    <h2>Editar Formato</h2>

    <form>
      <div class="form-groupId">
        <label for="id"></label>
        <input id="id" type="text"  placeholder="ID:" disabled />
      </div>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" />
      </div>

      <div class="form-group">
        <label for="precio">Precio</label>
        <input id="precio" type="number" />
      </div>
    </form>
  </main>

  <!-- Botón guardar -->
  <div class="button-container">
  <button type="button" class="btn-guardar" (click)="guardar()">GUARDAR</button>
  </div>
</div>
