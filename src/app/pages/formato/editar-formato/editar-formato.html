<div class="container">
  <app-header></app-header>

  <main class="wrap">
    <section class="card">
      <h1>Editar Formato</h1>

      @if (formato) {
      <form (ngSubmit)="onSave()">
        <!-- ID -->
        <div class="form-group">
          <label for="id">ID</label>
          <input id="id" [value]="formato.id" disabled />
        </div>

        <!-- Nombre -->
        <div class="form-group">
          <label for="name">Nombre</label>
          <input id="name" [(ngModel)]="formato.nombre" name="name" required />
        </div>

        <!-- Precio -->
        <div class="form-group">
          <label for="precio">Precio</label>
          <input id="precio" type="number" [(ngModel)]="formato.precio" name="precio" required />
        </div>

        <button type="submit">GUARDAR</button>
      </form>
      }
    </section>
  </main>

  <div class="button-group">
    <button (click)="volver()">VOLVER</button>
  </div>
</div>
