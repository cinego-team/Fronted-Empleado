<div class="page">
  <app-header></app-header>

  <h1>Formatos</h1>
  <div class="tabla-container">
    <table class="tabla-formatos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Precio</th>
        </tr>
      </thead>
      <tbody>
        @for (tipo of formatos; track tipo.id) {
        <tr
          [class.selected]="selec === formatos.indexOf(tipo)"
          (click)="seleccionar(formatos.indexOf(tipo))"
        >
          <td>{{ tipo.id }}</td>
          <td>{{ tipo.nombre }}</td>
          <td>{{ tipo.precio }}</td>
        </tr>
        }
      </tbody>
    </table>
    <div class="button-group">
      <button (click)="volver()">VOLVER</button>
      <button (click)="nuevo()">NUEVO</button>
      <button (click)="eliminar()">ELIMINAR</button>
      <button (click)="editar()">EDITAR</button>
    </div>
  </div>
</div>
