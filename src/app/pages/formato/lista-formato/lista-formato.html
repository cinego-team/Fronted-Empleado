<div class="container">
  <!-- Header -->
  <header class="header">
    <img src="assets/logo.png" alt="CineGo" class="logo" />
    <div class="usuario">
      <span class="icono-usuario">&#128100;</span>
      <span>Usuario</span>
    </div>
  </header>

  <!-- Título -->
  <h1 class="titulo">FORMATOS</h1>

  <!-- Tabla -->
  <div class="tabla-container">
    <table class="tabla-formatos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Precio</th>
        </tr>
      </thead>
        <tbody>
        <tr *ngFor="let formato of formatos; let i = index"
            [class.selected]="selectedIndex === i"
            (click)="selectRow(i)">
            <td>{{ formato.id }}</td>
            <td>{{ formato.nombre }}</td>
            <td>{{ formato.precio }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botones -->
  <div class="botones">
    <button class="btn" (click)="nuevoFormato()">NUEVO FORMATO</button>
    <button class="btn">ELIMINAR</button>
    <button class="btn" (click)="editarFormato()">EDITAR</button>
  </div>

  <!-- Flecha de navegación -->
  <div class="flecha" (click)="irListaSala()">
  &#10132;
</div>
