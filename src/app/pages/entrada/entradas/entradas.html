<div class="page">
  <!-- Topbar -->
  <header class="topbar">
    <img src="/assets/logo.png" alt="CineGo" class="logo" />
    <div class="user-section">
      <img src="/assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </div>
  </header>
      <h1> Entradas</h1>
    <div class="tabla-container">
    <table class="tabla-formatos">
    <thead>
      <tr>
        <th>ID</th>
        <th>Código de Seguridad</th>
       
      </tr>
    </thead>
    <tbody>
  @for (tipo of entradas; track tipo.id) {
    <tr [class.selected]="selectedRow === entradas.indexOf(tipo)" (click)="selectRow(entradas.indexOf(tipo))">
      <td>{{ tipo.id }}</td>
      <td>{{ tipo.codigoSeguridad }}</td>
    </tr>
  }
  </tbody>
  </table>
  <div class="button-group">
    
    <button (click)="onNew()">NUEVO</button>
    <button (click)="onEdit()">EDITAR</button>
    <button (click)="onDelete()">ELIMINAR</button>

  </div>
</div>
