<div class="page">
  <!-- Topbar -->
  <header class="topbar">
    <img src="/assets/logo.png" alt="CineGo" class="logo" (click)="inicio()"/>
    <div class="user-section">
      <img src="/assets/usuario.png" alt="Usuario" class="user-icon" />
      <span>Usuario</span>
    </div>
  </header>

  <!-- Main content -->
  <main class="wrap">
    <section class="card">
      <h1>Registrar Entrada</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
        <label for="codigo">Código de seguridad</label>
        <input
          id="codigo"
          type="text"
          formControlName="codigo"
          placeholder=""
        />

        <button type="submit">REGISTRAR</button>
      </form>
    </section>
    <div class="button-group">
      <button (click)="volver()">VOLVER</button>
      </div>
  </main>
</div>
