<app-header></app-header>
<div class="page">
  <h1>Géneros</h1>
  <div class="tabla-container">
    <table class="tabla-formatos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
        </tr>
      </thead>
      <tbody>
        @for (tipo of generos; track tipo.id) {
          <tr
            [class.selected]="selec === generos.indexOf(tipo)"
            (click)="seleccionar(generos.indexOf(tipo))"
          >
            <td>{{ tipo.id }}</td>
            <td>{{ tipo.nombre }}</td>
          </tr>
        }
      </tbody>
    </table>
    <div class="button-group">
      <button (click)="volver()">VOLVER</button>
      <button (click)="nuevo()">NUEVO</button>
      <button (click)="eliminar()">ELIMINAR</button>
      <button (click)="editar()">EDITAR</button>
    </div>
  </div>
  <div class="pagination-container">
    <button (click)="prevPage()" [disabled]="currentPage === 1" class="btn-pagination">
      Anterior
    </button>

    <span class="page-info">Pagina {{ currentPage }}</span>

    <button (click)="nextPage()" [disabled]="!hasMore" class="btn-pagination">Siguiente</button>
  </div>
</div>
