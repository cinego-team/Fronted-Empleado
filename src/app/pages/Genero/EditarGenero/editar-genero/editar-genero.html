<div class="page">
  <header class="topbar">
    <img src="assets/logo.png" alt="CineGo" class="logo" />
    <div class="user">
      <span class="icon">👤</span>
      <span class="label">Usuario</span>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h1>Editar Género</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
        <div class="pill">
          <label>ID:</label>
          <input id="id" type="text" formControlName="" />
        </div>

        <label for="nombre" class="lbl">Nombre</label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          placeholder="Ej.: Acción"
          [class.invalid]="f.nombre.touched && f.nombre.invalid"
        />

        <div class="error" *ngIf="f.nombre.touched && f.nombre.errors">
          <small *ngIf="f.nombre.errors['required']">El nombre es obligatorio.</small>
          <small *ngIf="f.nombre.errors['minlength']">Mínimo 2 caracteres.</small>
        </div>

        <button type="submit" [disabled]="form.invalid">GUARDAR</button>
      </form>
    </section>
  </main>
</div>
